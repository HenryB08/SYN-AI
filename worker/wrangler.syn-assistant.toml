# Wrangler config for the syn-assistant Worker (moved off wrangler.toml, which now configures syn-core
# for the Git-connected auto-deploy with root directory "worker").
# Deploy: npx wrangler deploy --config worker/wrangler.syn-assistant.toml
name = "syn-assistant"
main = "syn-assistant.js"
compatibility_date = "2024-11-01"

# The Anthropic API key is a SECRET, never committed here. Set it with:
#   npx wrangler secret put ANTHROPIC_API_KEY
# (see README.md)
