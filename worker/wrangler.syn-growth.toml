# Wrangler config for the syn-growth Worker (the Growth Engine).
#
# The Cloudflare Git build uses ONE root directory per worker, and all three configs live in worker/.
# So the syn-growth project uses root directory "worker" with a DEPLOY COMMAND that names THIS config:
#   npx wrangler deploy --config wrangler.syn-growth.toml
# (paths are relative to the root dir, so it's "wrangler.syn-growth.toml", not "worker/…"). The bare
# wrangler.toml in this folder configures syn-core; --config here overrides it for the syn-growth build.

name = "syn-growth"
main = "syn-growth.js"
compatibility_date = "2025-11-01"

# Cron triggers: follow-ups every 15 min + prior-month Receipts on the 1st at 08:00 UTC (see
# worker/EMAIL-FOLLOWUP.md + worker/RECEIPT.md). scheduled() branches on event.cron.
[triggers]
crons = ["*/15 * * * *", "0 8 1 * *"]

# The SAME D1 database syn-core uses (the account's only D1) — so Growth data + the shared `users` table
# (real auth) live in one database. Binding name MUST be SYN_DB (the Worker references env.SYN_DB).
[[d1_databases]]
binding       = "SYN_DB"
database_name = "syn-core"
database_id   = "d37969f2-ef28-45ab-ba3b-b9320c1e3701"

# Secrets are NEVER committed here — set each on the syn-growth Worker with `npx wrangler secret put`:
#   GROWTH_ADMIN_KEY   — admin credential; if unset, every /admin route fails closed (401)
#   ANTHROPIC_API_KEY  — server-side widget AI (/w/messages); never reaches the browser
#   RESEND_API_KEY     — follow-up + Receipt email (sent from the CLIENT's verified identity)
#   AUTH_SIGNING_KEY   — MUST equal syn-core's value, so /me/* can verify session tokens (dashboard)
